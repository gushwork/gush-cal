app = "gush-cal"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 4000
  force_https = true
  # "suspend" snapshots the idle Machine and resumes it on the next request,
  # far faster than a cold boot + Next.js start. Fly falls back to "stop" when a
  # Machine cannot be suspended.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Default limit (25 connections) is too low: opening a calendar prefetches
  # every sidebar page, each a dynamic render with several DB round trips.
  # Requests past hard_limit get a 503 from Fly's proxy.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
