# fly.toml app configuration file generated for gush-cal on 2026-08-13T11:40:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "gush-cal"
primary_region = 'iad'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  checks = [{ grace_period = '10s', interval = '30s', method = 'GET', path = '/api/health', timeout = '5s' }]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
